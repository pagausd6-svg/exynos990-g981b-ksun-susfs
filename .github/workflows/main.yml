name: Build S20+ (G985F) Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl flex git libelf-dev libssl-dev lz4 python3 zip unzip

      - name: Download Toolchains (Clang & GCC 4.9)
        run: |
          mkdir -p ../tc/clang10
          for url in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r370808.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r1/clang-r370808.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-gsi/clang-r370808.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r377782b.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz"; do
            if curl -fsSL "$url" -o /tmp/clang.tar.gz; then
              tar -xzf /tmp/clang.tar.gz -C ../tc/clang10
              rm -f /tmp/clang.tar.gz
              if [ -x ../tc/clang10/bin/clang ]; then
                echo "Using Clang from: $url"
                ../tc/clang10/bin/clang --version
                break
              fi
            fi
          done
          test -x ../tc/clang10/bin/clang

          git clone --depth=1 -b android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 ../tc/aarch64-linux-android-4.9
          git clone --depth=1 -b android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 ../tc/arm-linux-androideabi-4.9
          ln -sfn aarch64-linux-android-4.9 ../tc/gcc49
          ln -sfn aarch64-linux-android-4.9 ../tc/gcc-4.9
          ln -sfn aarch64-linux-android-4.9 ../tc/gcc
          ln -sfn aarch64-linux-android-4.9 ../tc/gcc64
          ln -sfn arm-linux-androideabi-4.9 ../tc/gcc32
          ln -sfn arm-linux-androideabi-4.9 ../tc/gcc49-32

      - name: Extract Firmware Blobs from boot.img
        run: |
          if curl -fL "https://github.com/pagausd6-svg/exynos990-g981b-ksun-susfs/releases/download/Blobs/boot.img.lz4" -o boot.img.lz4; then
            lz4 -d -f boot.img.lz4 boot.img
            rm -f boot.img.lz4
          else
            curl -fL "https://github.com/pagausd6-svg/exynos990-g981b-ksun-susfs/releases/download/Blobs/boot.img" -o boot.img
          fi
          ls -lh boot.img

          cat << 'EOF' > /tmp/smart_extract.py
          import glob, gzip, hashlib, os, struct, subprocess, sys

          b = open("boot.img", "rb").read()
          assert b[:8] == b"ANDROID!", "Not an Android boot image"
          kernel_size = struct.unpack_from("<I", b, 8)[0]
          page = struct.unpack_from("<I", b, 36)[0]
          kernel = b[page:page + kernel_size]
          print(f"Boot header: page={page}, kernel_size={kernel_size}, magic={kernel[:4].hex()}")

          if kernel[:2] == b"\x1f\x8b":
              kernel = gzip.decompress(kernel)
              print(f"Decompressed gzip kernel: {len(kernel)} bytes")
          elif kernel[:4] in (b"\x04\x22\x4d\x18", b"\x02\x21\x4c\x18"):
              open("/tmp/k.lz4", "wb").write(kernel)
              subprocess.run(["lz4", "-d", "-f", "/tmp/k.lz4", "/tmp/k.raw"], check=True)
              kernel = open("/tmp/k.raw", "rb").read()
              print(f"Decompressed lz4 kernel: {len(kernel)} bytes")

          manifests = sorted(glob.glob("tools/s20/firmware_manifest*.tsv"))
          assert manifests, "No firmware manifest found"
          wanted = {}
          for line in open(manifests[0]):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              rel, off, size, digest = line.split()
              wanted[rel] = (int(size), digest)

          klen = len(kernel)
          target_low = {}
          str_offs = {}
          for rel in wanted:
              pat = rel.encode("ascii") + b"\x00"
              pos = 0
              offs = []
              while True:
                  idx = kernel.find(pat, pos)
                  if idx == -1:
                      break
                  if idx == 0 or kernel[idx - 1] == 0:
                      offs.append(idx)
                      target_low.setdefault(idx & 0xfff, []).append((rel, idx))
                  pos = idx + 1
              if offs:
                  str_offs[rel] = offs

          print(f"Found name strings in kernel for {len(str_offs)}/{len(wanted)} blobs")
          candidates = {}

          # Method 1: Full scan of direct VA triples (collects all candidates, no early break)
          q = memoryview(kernel[:(klen // 8) * 8]).cast("Q")
          n = len(q) - 2
          for i in range(n):
              val = q[i]
              if val >= 0xffff000000000000:
                  low = val & 0xfff
                  if low in target_low:
                      dva = q[i + 1]
                      sz = q[i + 2]
                      if dva >= 0xffff000000000000 and 0 < sz < klen:
                          for rel, soff in target_low[low]:
                              base_va = val - soff
                              if base_va >= 0xffff000000000000 and (base_va & 0xfff) == 0:
                                  doff = dva - base_va
                                  if 0 <= doff < klen and sz <= klen - doff:
                                      key = ("direct_va", base_va)
                                      candidates.setdefault(key, {}).setdefault(rel, []).append((i * 8, doff, sz))

          # Method 2: Full scan of .rela.dyn (R_AARCH64_RELATIVE = 0x403)
          r403 = struct.pack("<Q", 0x403)
          rela_map = {}
          pos = 0
          while True:
              idx = kernel.find(r403, pos)
              if idx == -1:
                  break
              if idx >= 8 and (idx & 7) == 0 and idx + 24 * 20 <= klen:
                  if all(kernel[idx + k * 24 : idx + k * 24 + 8] == r403 for k in range(1, 20)):
                      start = idx - 8
                      while start >= 24 and kernel[start - 16 : start - 8] == r403:
                          start -= 24
                      cur = start
                      cnt = 0
                      while cur + 24 <= klen and kernel[cur + 8 : cur + 16] == r403:
                          roff, _, radd = struct.unpack_from("<QQQ", kernel, cur)
                          rela_map[roff] = radd
                          cur += 24
                          cnt += 1
                      print(f"Parsed .rela.dyn block at {hex(start)}: {cnt} entries")
                      pos = cur
                      continue
              pos = (idx + 8) & ~7

          if rela_map:
              for roff, radd in rela_map.items():
                  if (roff + 8) not in rela_map:
                      continue
                  low = radd & 0xfff
                  if low not in target_low:
                      continue
                  dva = rela_map[roff + 8]
                  for rel, soff in target_low[low]:
                      base_va = radd - soff
                      if base_va < 0xffff000000000000 or (base_va & 0xfff) != 0:
                          continue
                      eoff = roff - base_va
                      doff = dva - base_va
                      if 0 <= eoff <= klen - 24 and 0 <= doff < klen:
                          sz = struct.unpack_from("<Q", kernel, eoff + 16)[0]
                          if 0 < sz <= klen - doff:
                              key = ("rela_dyn", base_va)
                              candidates.setdefault(key, {}).setdefault(rel, []).append((eoff, doff, sz))

          def score_candidate(rel_map):
              matched = len(rel_map)
              exact_hash = 0
              exact_size = 0
              for rel, items in rel_map.items():
                  msz, mdig = wanted[rel]
                  if any(hashlib.sha256(kernel[d:d + s]).hexdigest() == mdig for _, d, s in items):
                      exact_hash += 1
                  if any(s == msz for _, _, s in items):
                      exact_size += 1
              return (matched, exact_hash, exact_size)

          best_key = None
          best_score = (-1, -1, -1)
          for key, rel_map in candidates.items():
              sc = score_candidate(rel_map)
              if sc > best_score:
                  best_score = sc
                  best_key = key

          print(f"Evaluated {len(candidates)} candidates; best={best_key} score(matched,hash,size)={best_score}")
          assert best_key is not None, "Could not locate .builtin_fw in kernel"

          best_map = candidates[best_key]
          eoffs = sorted(items[0][0] for items in best_map.values() if len(items) == 1)
          med_eoff = eoffs[len(eoffs) // 2] if eoffs else 0

          extracted = {}
          for rel in wanted:
              if rel not in best_map:
                  continue
              msz, mdig = wanted[rel]
              items = best_map[rel]
              items.sort(key=lambda x: (
                  0 if hashlib.sha256(kernel[x[1]:x[1] + x[2]]).hexdigest() == mdig else 1,
                  0 if x[2] == msz else 1,
                  abs(x[0] - med_eoff)
              ))
              eoff, doff, sz = items[0]
              dig = hashlib.sha256(kernel[doff:doff + sz]).hexdigest()
              status = "EXACT_MATCH" if dig == mdig else f"DIFF_VERSION (manifest size={msz})"
              print(f"  {rel}: eoff={hex(eoff)} off={hex(doff)} size={sz} {status}")
              dst = os.path.join("firmware", rel)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              with open(dst, "wb") as f:
                  f.write(kernel[doff:doff + sz])
              extracted[rel] = True

          missing = [rel for rel in wanted if rel not in extracted]
          if missing:
              print("MISSING BLOBS:", missing)
              sys.exit(1)
          print("ALL REQUIRED FIRMWARE BLOBS EXTRACTED!")
          EOF

          python3 /tmp/smart_extract.py
          rm -f boot.img /tmp/smart_extract.py /tmp/k.lz4 /tmp/k.raw

      - name: Build Kernel for G985F
        run: |
          chmod +x build.sh
          ./build.sh -m g985f
          if [ -f mkzip.sh ]; then
            chmod +x mkzip.sh
            ./mkzip.sh -m g985f || true
          fi

      - name: Upload Built Kernel
        uses: actions/upload-artifact@v4
        with:
          name: S20Plus-G985F-Kernel
          path: |
            **/*.zip
            out/arch/arm64/boot/Image*
            arch/arm64/boot/Image*
          if-no-files-found: warn
